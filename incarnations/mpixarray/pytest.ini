[pytest]
# The FlowGraph registry dispatch uses numba literal_unroll / first-
# class function types, which warn "experimental" on every graph
# compile (~21/run). This is a DELIBERATE, verified design choice (see
# pws_phoenix/CLAUDE.md "FlowGraph port"); silence the known warning so
# it does not drown real test output. Other warnings still surface.
# (flow_graph.py filters the same warning for NON-pytest runs; pytest
# manages its own warning filters per test, hence this separate entry.)
# The netCDF4 "numpy.ndarray size changed" RuntimeWarning is
# known-benign cython size-check noise. Oddity (July 2026): it is
# emitted at netCDF4 import only UNDER PYTEST (plugins disabled
# included), never under plain python -W error -- mechanism
# unresolved after bisecting the stack. The REAL ABI issue it once
# flagged (a PyPI netCDF4 wheel displacing the conda build) is fixed
# and prevented by the environment.yaml `netCDF4!=1.7.4` pin. The
# message-scoped ignore cannot mask a real ABI break, which presents
# as crashes, not this text.
filterwarnings =
    ignore::numba.core.errors.NumbaExperimentalFeatureWarning
    ignore:numpy.ndarray size changed:RuntimeWarning
