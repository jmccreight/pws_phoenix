[pytest]
# The FlowGraph registry dispatch uses numba literal_unroll / first-
# class function types, which warn "experimental" on every graph
# compile (~21/run). This is a DELIBERATE, verified design choice (see
# pws_phoenix/CLAUDE.md "FlowGraph port"); silence the known warning so
# it does not drown real test output. Other warnings still surface.
# (flow_graph.py filters the same warning for NON-pytest runs; pytest
# manages its own warning filters per test, hence this separate entry.)
filterwarnings =
    ignore::numba.core.errors.NumbaExperimentalFeatureWarning
