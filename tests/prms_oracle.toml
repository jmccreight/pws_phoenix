# Pinned pws-prms-oracle answer keys (tests/conftest.py checks them at
# session start against the markers in PWS_TEST_DATA). Keys are the
# oracle's content keys: an inputs key per domain (.oracle_ikey) and,
# per answer directory, an outputs key per platform (.oracle_okey;
# platforms differ -- snow knife-edges). Bumping a key is a reviewed
# commit: the place where answer changes become visible. Only the
# answer sets the tests read are pinned; the comment names the control.

