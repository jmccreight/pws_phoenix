name: pwpx
channels:
  - conda-forge
  - nodefaults
dependencies:
  - asv
  - click != 8.1.0
  # contextily + tqdm: pywatershed import-chain deps (parity tests;
  # contextily feeds only its plotting) -- pyPRMS stays pip-only
  - contextily
  # epiweeks4cf is the conda-forge name for the `epiweeks` module
  # (Time.current_epiweek -- STARFIT seasonal release)
  - epiweeks4cf
  - geopandas
  - git
  - make
  - ipython
  # notebooks (incarnations/mpixarray/examples/); rides
  # into CI/HPC builds too -- accepted (JLM Aug 2026) over a separate
  # env or the lab-from-base + ipykernel pattern. jupytext opens
  # py:percent files AS notebooks (right-click -> Open With ->
  # Notebook) with edits round-tripping to the .py
  - jupyterlab
  - jupytext
  # ---- IO-stack + numba pins: every pin here is load-bearing and
  # gated by the full test sweep (serial + MPI + a notebook
  # script-run). History: the Jul/Aug 2026 pins encoded env surgery
  # that a re-solve once silently undid; the Aug 2026 modernization
  # pass then adopted zarr 3 + xarray 2026.7 DELIBERATELY (validated
  # in a fresh scratch env before landing here). Do not relax or bump
  # without the sweep. ----
  # 1.7.3 pinned (rev-2 surgery downgraded 1.7.4 -> 1.7.3); also
  # matches pyPRMS's !=1.7.4 requirement so its pip install does NOT
  # replace the conda build with a PyPI wheel (ABI mismatch with
  # conda numpy -> "numpy.ndarray size changed" RuntimeWarning);
  # revisit when pyPRMS lands on conda-forge
  - netCDF4=1.7.3
  - libnetcdf=4.9.*
  - networkx  # Discretization.topological_order (pywatershed-identical)
  # numba's ceiling, NOT ours: numba 0.66.0 (latest, Aug 2026) still
  # declares numpy<2.5 (also the mypy hook's pin)
  - numpy>=2.0.0,<2.5
  - numba
  # pyPRMS 0.9.10 is UNUSABLE under packaging 26.3 (Version(None)
  # now raises InvalidVersion; pyPRMS's metadata filter catches only
  # TypeError -> every MetaData() call dies). Fix offered upstream
  # (pyPRMS branch ask/packaging-version-none; see
  # prms_translate/UPSTREAM_ASKS.md item 0); drop this pin when it
  # lands in the installed pyPRMS
  - packaging=26.2
  # graphviz layout for ModelContractGraph.to_dot (notebook 00;
  # falls back to mermaid without it) -- was an ad hoc install in
  # the old env, now on the record
  - python-graphviz
  - xarray=2026.7.*  # the zarr-3 era pair (zarr pin below)
  - pandas>=1.4.0
  - pip
  - mypy
  - pre-commit
  - pytest!=8.1.0
  - pytest-cov
  - pytest-env
  - pytest-order
  - pytest-xdist
  - python>=3.14
  - pyyaml
  - ruff
  - safety
  - sphinx
  - sphinx-book-theme>=0.3.3
  - sphinx-autodoc-typehints>=2.2.1
  - sphinx-autosummary-accessors
  - sphinx-copybutton
  - tqdm
  # zarr 3 adopted deliberately (Aug 2026 modernization; paired with
  # xarray 2026.7 above -- the historical breakage was the MISMATCHED
  # pair, xarray 2026.4 + zarr 3.3). Back on conda: the old
  # zarr-as-pip arrangement existed only to defend the v2 line
  # against conda re-solves and is obsolete. KNOWN TWO-STEP on a
  # fresh env create: pyPRMS 0.9.10's pip install (below, runs last)
  # declares zarr<3 and WILL downgrade zarr to 2.18 -- restore with
  #   conda install -n <env> zarr=3.3.* --freeze-installed
  # (the validated build path). Harmless otherwise: pyPRMS's zarr
  # use is an optional Cbh engine we never touch, and its
  # development branch has already relaxed the pin -- this two-step
  # dies when pyPRMS >0.9.10 is picked up.
  - zarr=3.3.*
  # ---- BEGIN parallel-io ----------------------------------------
  # The MPI + parallel-HDF5/NetCDF stack (mirrors the mpix meta-repo
  # environment_parallel_io.yaml) hosting the mpixarray ecosystem
  # (installed separately, in dependency order -- see the meta-repo
  # setup_environment.sh or the CI workflow). This block is the ONLY
  # parallel/serial difference: a serial env (or a platform conda
  # cannot solve, e.g. Windows has no conda-forge mpich/parallel
  # hdf5) is derived by DELETING this block -- CI does exactly that
  # for its Windows cell. Serial pws_phoenix runs never need it
  # (the mpixarray import is optional).
  - mpich
  - mpi4py
  - hdf5=1.14.*=mpi*  # rev-2 surgery: 2.1.0 -> 1.14.6 (netcdf 4.9 compat)
  - h5py=*=mpi*
  - h5netcdf
  - pytest-mpi
  # ---- END parallel-io ------------------------------------------
  - pip:
      - pytest-error-for-skips
      # pywatershed import-chain dep for the A/B parity tests
      # (pywatershed itself is used from the mpix-root repo clone via
      # sys.path); contextily + tqdm ride in the conda section above
      - pyPRMS
