name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash -el {0}  # login shell so the micromamba env is active

    steps:
      - uses: actions/checkout@v4

      # Build the pwpx serial dev env from environment.yaml (prefer .yaml). The
      # MPI/mpixarray stack is intentionally absent -- CI runs serial tests only;
      # the MPI streaming test runs locally / on HPC. See pws_phoenix/CLAUDE.md.
      - name: Set up environment (pwpx)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yaml
          cache-environment: true

      - name: Lint
        run: ruff check incarnations/mpixarray/

      - name: Format
        run: ruff format --check incarnations/mpixarray/

      - name: mypy
        run: mypy --check-untyped-defs --ignore-missing-imports incarnations/mpixarray/

      - name: Run serial tests
        run: |
          cd incarnations/mpixarray
          python -m pytest tests/ -vv -n=4 \
            --ignore=tests/test_up_low_regression_mpi.py \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./incarnations/mpixarray/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./incarnations/mpixarray/junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          file: ./incarnations/mpixarray/junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
