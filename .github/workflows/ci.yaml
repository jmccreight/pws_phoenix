name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash -el {0}  # login shell so the micromamba env is active

    steps:
      - uses: actions/checkout@v4

      # Build the pwpx env from environment.yaml (now includes the
      # parallel-io block). This fast job runs lint + serial tests only;
      # the full ecosystem + MPI + platform matrix is ci_ecosystem.yaml.
      - name: Set up environment (pwpx)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yaml
          cache-environment: true

      - name: Lint
        run: ruff check incarnations/mpixarray/

      - name: Format
        run: ruff format --check incarnations/mpixarray/

      - name: mypy
        run: mypy --check-untyped-defs --ignore-missing-imports incarnations/mpixarray/

      - name: Run serial tests
        run: |
          cd incarnations/mpixarray
          # *_mpi.py files import mpi4py at module level -- without it
          # (this serial env) collection itself errors, so ignore-glob
          # them all (a bare --ignore of one file rotted as more were
          # added)
          python -m pytest tests/ -vv -n=4 \
            --ignore-glob='tests/*_mpi.py' \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./incarnations/mpixarray/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./incarnations/mpixarray/junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          file: ./incarnations/mpixarray/junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
