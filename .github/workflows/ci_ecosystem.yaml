# CI over the FULL parallel environment + the mpixarray ecosystem,
# across platforms. Complements ci.yaml (fast ubuntu serial lint +
# tests, no ecosystem):
#
# - ubuntu/macos: build the parallel env from environment_mpi.yaml, check
#   out the two ecosystem repos (PRIVATE GITHUB MIRRORS of the
#   code.usgs.gov originals: mpix main, mpixarray 1.0.0) with a
#   read-only PAT, install them in dependency order, then run the
#   full suite -- serial + every MPI
#   test file under mpirun (tests/run_tests.sh). Data-dependent
#   suites (drb/starfit) skip cleanly: no domain data in CI.
# - windows: the serial environment.yaml (conda-forge has no mpich /
#   parallel hdf5 on Windows), no ecosystem, serial tests only
#   (mpixarray is an optional import; see model.py).
#
# Setup required once (see the session notes / CLAUDE.md):
# 1. Mirror mpix and mpixarray to private GitHub repos under
#    ECOSYSTEM_ORG (edit below).
# 2. Create a fine-grained PAT, Contents: read-only, scoped to those
#    two repos; store it as the ECOSYSTEM_READ_PAT repo secret.
# Note: fork PRs do not receive secrets -- the ecosystem checkout
# fails there by design; run this workflow on push/internal PRs.

name: CI ecosystem

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # EDIT ME: the GitHub org/user hosting the private mirrors
  ECOSYSTEM_ORG: EDIT-ME-org

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash -el {0}  # login shell so the micromamba env is active

    steps:
      # pws_phoenix beside the ecosystem repos = the meta-repo layout
      - uses: actions/checkout@v4
        with:
          path: pws_phoenix

      - name: Set up environment (pwpx_mpi)
        if: runner.os != 'Windows'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: pws_phoenix/environment_mpi.yaml
          cache-environment: true

      - name: Set up environment (pwpx, serial)
        if: runner.os == 'Windows'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: pws_phoenix/environment.yaml
          cache-environment: true

      - name: Check out mpix
        if: runner.os != 'Windows'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ECOSYSTEM_ORG }}/mpix
          ref: main
          token: ${{ secrets.ECOSYSTEM_READ_PAT }}
          path: mpix

      - name: Check out mpixarray
        if: runner.os != 'Windows'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ECOSYSTEM_ORG }}/mpixarray
          ref: 1.0.0
          token: ${{ secrets.ECOSYSTEM_READ_PAT }}
          path: mpixarray

      - name: Install ecosystem (dependency order)
        if: runner.os != 'Windows'
        run: |
          # mpixarray requires mpix by plain name: installing mpix
          # first makes pip take the local clone. Every other
          # requirement of both packages is already in the conda env
          # (environment_mpi.yaml "ecosystem requirements"), so nothing
          # is pulled from PyPI.
          pip install -e mpix
          pip install -e mpixarray

      - name: Install pws_phoenix (editable, no deps)
        run: pip install -e pws_phoenix --no-deps

      # unix: the full sweep (serial suite + each MPI test file under
      # mpirun; exit code = number of failed suites)
      - name: Full test sweep (serial + MPI)
        if: runner.os != 'Windows'
        run: |
          cd pws_phoenix
          MPI_CMD="mpirun -n 4" bash tests/run_tests.sh

      # windows: serial only (no ecosystem; *_mpi.py files import
      # mpi4py at module level -> must be ignore-globbed, collection
      # itself errors without it)
      - name: Serial tests
        if: runner.os == 'Windows'
        run: |
          cd pws_phoenix
          python -m pytest tests/ -vv --ignore-glob='tests/*_mpi.py'
